    <style>
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
        @keyframes float { 0% { transform: translateY(0); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0); } }
        @keyframes modal-pop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        html, body {
            background: #020813;
            color: white;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: 'Orbitron', sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            height: 100%;
            max-height: 100vh;
            box-sizing: border-box;
            padding: 10px;
        }

        #game-frame {
            position: relative;
            width: min(410px, 95vw, 84vh * 9 / 16);
            height: min(730px, 95vw * 16 / 9, 84vh);
            aspect-ratio: 9 / 16;
            background: #000;
            border: 3px solid rgba(0, 255, 255, 0.25);
            border-radius: 25px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(0, 255, 255, 0.1);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            container-type: inline-size;
            container-name: game;
        }

        #crazy-banner-container {
            width: min(410px, 95vw, 84vh * 9 / 16);
            height: 34px;
            background: rgba(0, 40, 100, 0.2);
            border: 2px dashed rgba(0, 255, 255, 0.35);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }

        #crazy-banner-container:hover {
            border-color: rgba(0, 255, 255, 0.6);
            background: rgba(0, 40, 100, 0.3);
        }

        #top-bar-container {
            transform-origin: top center;
            transition: transform 0.15s ease-out;
        }

        @container game (max-width: 450px) { #top-bar-container { transform: translateX(-50%) scale(0.95) !important; } }
        @container game (max-width: 410px) { #top-bar-container { transform: translateX(-50%) scale(0.88) !important; } }
        @container game (max-width: 380px) { #top-bar-container { transform: translateX(-50%) scale(0.80) !important; } }
        @container game (max-width: 340px) { #top-bar-container { transform: translateX(-50%) scale(0.72) !important; } }
        @container game (max-width: 300px) { #top-bar-container { transform: translateX(-50%) scale(0.65) !important; } }

        #ui-root {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        
        canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            touch-action: none;
        }
        
        .interactive-btn:active { transform: scale(0.95); }
        .interactive-btn { transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        
        .floating-score {
            position: absolute; color: #00ffff; font-weight: 900; pointer-events: none;
            text-shadow: 0 0 10px rgba(0,255,255,0.8); animation: score-float 1s ease-out forwards;
            font-size: 1.5rem; z-index: 1000;
        }
        @keyframes score-float { to { transform: translateY(-50px); opacity: 0; } }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: #00ffff88; border-radius: 10px; }

        #nexapp-splash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #020e25 0%, #000511 100%);
            z-index: 2100000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            font-family: 'Orbitron', sans-serif;
            transition: opacity 0.8s cubic-bezier(0.25, 1, 0.5, 1), visibility 0.8s;
            pointer-events: auto;
            overflow: hidden;
        }

        #nexapp-splash.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .splash-bg-decor {
            position: absolute;
            width: 150%;
            height: 150%;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 255, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(255, 0, 255, 0.1) 0%, transparent 40%);
            animation: splash-bg-rotate 25s linear infinite;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes splash-bg-rotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .splash-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 40px;
            width: 85%;
            text-align: center;
        }

        .logo-wrapper { animation: logo-float 4s ease-in-out infinite; }
        @keyframes logo-float { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-8px) rotate(1deg); } }

        .nexapp-logo {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 5px;
            background: linear-gradient(135deg, #00ffff, #0088ff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(0, 255, 255, 0.6)) drop-shadow(0 0 30px rgba(0, 255, 255, 0.2));
            text-transform: uppercase;
            line-height: 1.1;
        }

        .nexapp-subtitle {
            font-size: 0.65rem;
            letter-spacing: 6px;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 8px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.4);
            font-weight: 700;
            text-transform: uppercase;
        }

        .loader-container {
            width: 100%;
            max-width: 250px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            transition: opacity 0.5s ease;
        }

        .loader-track {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.5), 0 0 8px rgba(0,255,255,0.1);
            position: relative;
        }

        .loader-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00ffaa, #00ffff);
            border-radius: 10px;
            box-shadow: 0 0 10px #00ffff, 0 0 20px #00ffaa;
            transition: width 0.1s ease-out;
        }

        .loader-status {
            font-size: 0.62rem;
            color: #add8e6;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: bold;
            opacity: 0.8;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
            animation: pulse 1.5s infinite;
        }

        #splash-start-btn {
            padding: 14px 30px;
            font-size: 1rem;
            font-weight: bold;
            color: #000;
            background: linear-gradient(135deg, #00ffaa 0%, #00ffff 100%);
            border: 2px solid #fff;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0,255,170,0.4), inset 0 1px 0 rgba(255,255,255,0.5);
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: start-pulse 2s infinite, modal-pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            pointer-events: auto;
            transition: all 0.2s;
        }

        #splash-start-btn:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(0,255,170,0.8); filter: brightness(1.2); }
        #splash-start-btn:active { transform: scale(0.95); }
        @keyframes start-pulse { 0%, 100% { box-shadow: 0 0 15px rgba(0,255,170,0.4); } 50% { box-shadow: 0 0 30px rgba(0,255,170,0.8), 0 0 10px #00ffff; } }

        /* Breeding Glow Effect for Parents */
        .breeding-glow {
            filter: drop-shadow(0 0 15px #ff00ff) drop-shadow(0 0 5px white) brightness(1.2) !important;
            animation: breeding-pulse 1.5s ease-in-out infinite;
        }
        @keyframes breeding-pulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px #ff00ff) brightness(1.1); }
            50% { transform: scale(1.1); filter: drop-shadow(0 0 25px #00ffff) brightness(1.4); }
        }
    </style>

<style>
    #rosebud-exported-splash {

            <div id="crazy-banner-content" style="font-size: 0.65rem; color: #add8e6; text-transform: uppercase; letter-spacing: 0.5px; font-weight: bold; text-align: center; max-width: 90%; line-height: 1.1; font-family: 'Orbitron', sans-serif; transition: opacity 0.3s ease-out; pointer-events: none; text-shadow: 0 0 5px rgba(0,255,255,0.25);">Loading Sponsor Ad...</div>

    <script type="module" src="./main.js"></script>

<script>
    (() => {
        const splashRoot = document.getElementById('rosebud-exported-splash');
        if (!splashRoot) return;

        let isReady = false;
        let isMinimumVisibleTimeElapsed = false;
        let isHidden = false;

        const maybeHideSplash = () => {
            if (isHidden || !isReady || !isMinimumVisibleTimeElapsed) return;

            isHidden = true;
            splashRoot.classList.add('is-hiding');
            window.setTimeout(() => splashRoot.remove(), 500);
        };

        const markReady = () => {
            isReady = true;
            maybeHideSplash();
        };

        window.setTimeout(() => {
            isMinimumVisibleTimeElapsed = true;
            maybeHideSplash();
        }, 1000);

        if (document.readyState === 'complete') {
            markReady();
        } else {
            window.addEventListener('load', markReady, { once: true });
        }

        
    })();
</script></body>
